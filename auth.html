<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Makerspace Club — Account</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="override.css"><style>
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,#422015,#07090d 45%)}.auth-shell{width:min(500px,100%);position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,104,29,.035));border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:clamp(28px,5vw,52px);box-shadow:0 28px 90px rgba(0,0,0,.4);backdrop-filter:blur(18px)}.auth-shell>*:not(.auth-orb){position:relative;z-index:1}.auth-shell .brand{margin-bottom:18px}.auth-kicker{font:500 10px 'DM Mono';letter-spacing:.16em;color:var(--cyan)!important;margin:0 0 16px}.auth-shell h1{font:700 clamp(42px,7vw,64px)/.92 'Space Grotesk';letter-spacing:-.07em;margin:0 0 12px}.auth-shell h1 em{color:var(--cyan);font:400 .9em Georgia}.auth-shell p{color:#aab1ba;font-size:13px;line-height:1.6}.auth-tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin:28px 0 18px}.auth-tabs button{border:0;background:none;color:#89929d;padding:12px 0;cursor:pointer;font:700 11px 'DM Mono';letter-spacing:.08em}.auth-tabs button.active{color:var(--cyan);border-bottom:2px solid var(--cyan)}form{display:grid;gap:13px}label{font:500 10px 'DM Mono';letter-spacing:.1em;color:#aab1ba}input,textarea{width:100%;margin-top:7px;padding:14px 15px;border-radius:10px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.15);color:var(--paper);font:13px Manrope;outline:none;transition:.2s}input:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(255,104,29,.12)}form .button{justify-content:space-between;margin-top:8px;width:100%}#status{min-height:22px;color:var(--cyan);font-size:12px;margin:0}.hidden{display:none!important}.back{display:block;color:#aab1ba;font-size:12px;margin-top:25px;text-decoration:none}.auth-orb{position:absolute!important;border-radius:50%;filter:blur(2px);pointer-events:none}.auth-orb-one{width:220px;height:220px;right:-110px;top:-110px;background:rgba(255,104,29,.18)}.auth-orb-two{width:180px;height:180px;left:-120px;bottom:-100px;background:rgba(255,173,114,.1)}
</style></head>
<body><main class="auth-shell"><div class="auth-orb auth-orb-one"></div><div class="auth-orb auth-orb-two"></div><a href="index.html" class="brand"><img src="Logo.jpg" alt="Makerspace crest"><span>MAKERSPACE<span class="dot">.</span></span></a><p class="auth-kicker">MBHS · MEMBER ACCESS</p><h1>Build your<br><em>account.</em></h1><p>Join the club, access resources, and keep up with what we are building.</p><div class="auth-tabs"><button class="active" data-mode="login">SIGN IN</button><button data-mode="signup">SIGN UP</button><button data-mode="verify">VERIFY EMAIL</button></div><p id="status" role="status"></p>
<form id="login"><label>EMAIL<input type="email" name="email" required autocomplete="email"></label><label>PASSWORD<input type="password" name="password" required autocomplete="current-password"></label><button class="button" type="submit">Sign in <span>→</span></button></form>
<form id="signup" class="hidden"><label>NAME<input name="name" required autocomplete="name"></label><label>EMAIL<input type="email" name="email" required autocomplete="email"></label><label>PASSWORD<input type="password" name="password" minlength="8" required autocomplete="new-password"></label><button class="button" type="submit">Create account <span>→</span></button></form>
<form id="verify" class="hidden"><label>EMAIL<input type="email" name="email" required autocomplete="email"></label><label>VERIFICATION CODE<input name="code" inputmode="numeric" pattern="[0-9]{6}" required></label><button class="button" type="submit">Verify email <span>→</span></button></form>
<a href="index.html" class="back">← Back to the club</a></main><script src="auth.js"></script></body></html>
